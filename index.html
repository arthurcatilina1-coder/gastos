
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f1a;
  --bg2: #111827;
  --bg3: #1a2235;
  --bg4: #222d42;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --silver: #a8b4c8;
  --silver2: #cdd5e0;
  --silver3: #e8edf4;
  --muted: #4a5568;
  --accent: #4f8ef7;
  --accent2: #7eb3ff;
  --accent3: rgba(79,142,247,0.15);
  --text: #e8edf4;
  --text2: #a8b4c8;
  --text3: #5a6880;
  --danger: #e07070;
  --success: #5db88a;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
.app { max-width: 420px; margin: 0 auto; font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }

.screen { display: none; padding: 28px 20px 100px; animation: fadeUp 0.3s ease; }
.screen.active { display: block; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* MONTH BAR */
.month-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.month-bar button { background: none; border: 1px solid var(--border2); border-radius: 50%; width: 36px; height: 36px; font-size: 14px; cursor: pointer; color: var(--silver); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.month-bar button:active { background: var(--bg3); color: var(--text); }
.month-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; letter-spacing: 0.02em; color: var(--text); }

/* HERO */
.hero { background: linear-gradient(135deg, #131d35 0%, #0d1628 100%); border: 1px solid var(--border2); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 20px; position: relative; overflow: hidden; }
.hero::before { content:''; position:absolute; top:-50px; right:-50px; width:180px; height:180px; border-radius:50%; border:1px solid rgba(79,142,247,0.12); }
.hero::after { content:''; position:absolute; top:-25px; right:-25px; width:110px; height:110px; border-radius:50%; border:1px solid rgba(79,142,247,0.08); }
.hero-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; font-weight: 400; }
.hero-value { font-family: 'Cormorant Garamond', serif; font-size: 50px; font-weight: 300; color: var(--silver3); line-height: 1; margin-bottom: 22px; letter-spacing: -0.01em; }
.hero-value span.prefix { font-size: 20px; color: var(--accent2); font-weight: 400; vertical-align: top; margin-top: 12px; display: inline-block; margin-right: 2px; }
.hero-row { display: flex; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 18px; }
.hero-stat { flex: 1; }
.hero-stat + .hero-stat { border-left: 1px solid rgba(255,255,255,0.06); padding-left: 16px; }
.hero-stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(168,180,200,0.45); margin-bottom: 4px; }
.hero-stat-val { font-size: 14px; font-weight: 300; color: var(--silver2); }
.hero-stat-val.accent { color: var(--accent2); }
.hero-stat-val.danger { color: var(--danger); }
.hero-stat-val.success { color: var(--success); }

/* META */
.meta-wrap { margin-bottom: 20px; }
.meta-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.meta-label-row span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); }
.meta-label-row .meta-pct { font-size: 12px; color: var(--accent2); }
.meta-bar-track { height: 2px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.meta-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.5s ease; }
.meta-bar-fill.over { background: var(--danger); }
.meta-input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.meta-input-row label { font-size: 11px; color: var(--text3); white-space: nowrap; }
.meta-input-row input { flex: 1; font-size: 14px; font-family: 'DM Sans', sans-serif; border: none; border-bottom: 1px solid var(--border2); padding: 6px 0; background: transparent; color: var(--text); outline: none; }
.meta-input-row input:focus { border-bottom-color: var(--accent); }

/* SECTION HEAD */
.section-head { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 400; font-style: italic; color: var(--silver); margin-bottom: 12px; }

/* CAT BARS */
.cat-bars { display: flex; flex-direction: column; background: var(--bg2); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
.cat-bar-row { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.cat-bar-row:last-child { border-bottom: none; }
.cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.cat-name { font-size: 12px; color: var(--silver); width: 88px; flex-shrink: 0; }
.cat-track { flex: 1; height: 2px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.cat-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
.cat-amt { font-size: 12px; color: var(--text3); min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; }

/* CHART */
.chart-wrap { background: var(--bg2); border-radius: 16px; border: 1px solid var(--border); padding: 16px; margin-bottom: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
.legend-sq { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* FORM */
.form-wrap { background: var(--bg2); border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.field input, .field select { width: 100%; font-size: 15px; font-family: 'DM Sans', sans-serif; border: none; border-bottom: 1px solid var(--border2); padding: 8px 0; background: transparent; color: var(--text); outline: none; -webkit-appearance: none; appearance: none; border-radius: 0; }
.field input::placeholder { color: var(--muted); }
.field input:focus, .field select:focus { border-bottom-color: var(--accent); }
.field select option { background: var(--bg2); color: var(--text); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn-add { width: 100%; background: var(--accent); border: none; border-radius: 12px; padding: 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: opacity 0.2s; margin-top: 4px; }
.btn-add:active { opacity: 0.8; }

/* EXPENSE LIST */
.expense-list { display: flex; flex-direction: column; background: var(--bg2); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
.day-group-label { font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text3); padding: 10px 16px 6px; background: var(--bg3); }
.expense-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.expense-item:last-child { border-bottom: none; }
.cat-dot-lg { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.e-info { flex: 1; min-width: 0; }
.e-desc { font-size: 14px; color: var(--silver2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e-cat { font-size: 11px; color: var(--text3); margin-top: 2px; }
.e-amt { font-size: 14px; color: var(--silver); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.e-del { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; padding: 4px; transition: color 0.15s; }
.e-del:active { color: var(--danger); }
.empty { font-size: 17px; color: var(--text3); text-align: center; padding: 2.5rem 0; font-style: italic; font-family: 'Cormorant Garamond', serif; }

/* ANNUAL */
.annual-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 20px; }
.annual-cell { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.annual-cell.current { border-color: rgba(79,142,247,0.4); }
.annual-month { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
.annual-val { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--silver); }
.annual-val.current { color: var(--accent2); }
.annual-val.empty-val { color: var(--muted); font-style: italic; }

/* BOTTOM NAV */
.bottom-nav { display: flex; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: rgba(11,15,26,0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border2); z-index: 100; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 14px; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text3); transition: color 0.2s; }
.nav-btn.active { color: var(--accent2); }
.nav-icon { font-size: 17px; line-height: 1; }
</style>

<div class="app">

  <!-- LANÇAR -->
  <div class="screen active" id="screen-add">
    <div class="month-bar">
      <button id="prevM">&#8592;</button>
      <div class="month-title" id="monthLabel">—</div>
      <button id="nextM">&#8594;</button>
    </div>
    <div class="hero" id="heroCard">
      <div class="hero-label" id="heroLabel">Total em</div>
      <div class="hero-value"><span class="prefix">R$</span><span id="hTotal">0,00</span></div>
      <div class="hero-row">
        <div class="hero-stat">
          <div class="hero-stat-label">Média / dia</div>
          <div class="hero-stat-val accent" id="hMedia">R$ 0</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Maior categoria</div>
          <div class="hero-stat-val" id="hCat">—</div>
        </div>
      </div>
    </div>
    <div class="section-head">Novo lançamento</div>
    <div class="form-wrap">
      <div class="field">
        <label>Descrição</label>
        <input type="text" id="desc" placeholder="Ex: Mercado, Farmácia..." autocomplete="off" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Valor (R$)</label>
          <input type="number" id="amount" inputmode="decimal" placeholder="0,00" min="0" step="0.01" />
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="dateInput" />
        </div>
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="cat">
          <option>Alimentação</option><option>Moradia</option><option>Transporte</option>
          <option>Saúde</option><option>Lazer</option><option>Educação</option><option>Outros</option>
        </select>
      </div>
      <button class="btn-add" id="addBtn">Registrar</button>
    </div>
    <div class="section-head">Lançamentos</div>
    <div class="expense-list" id="expenseList"><div class="empty">Nenhum gasto registrado</div></div>
  </div>

  <!-- RESUMO -->
  <div class="screen" id="screen-resumo">
    <div class="month-bar">
      <button id="prevM2">&#8592;</button>
      <div class="month-title" id="monthLabel2">—</div>
      <button id="nextM2">&#8594;</button>
    </div>
    <div class="hero">
      <div class="hero-label">Total gasto</div>
      <div class="hero-value"><span class="prefix">R$</span><span id="rTotal">0,00</span></div>
      <div class="hero-row">
        <div class="hero-stat">
          <div class="hero-stat-label">Média / dia</div>
          <div class="hero-stat-val accent" id="rMedia">—</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Meta</div>
          <div class="hero-stat-val" id="rMeta">—</div>
        </div>
      </div>
    </div>
    <div class="meta-wrap">
      <div class="meta-label-row">
        <span>Meta mensal</span>
        <span class="meta-pct" id="metaPct"></span>
      </div>
      <div class="meta-bar-track"><div class="meta-bar-fill" id="metaBar" style="width:0%"></div></div>
      <div class="meta-input-row">
        <label>Definir limite:</label>
        <input type="number" id="metaInput" inputmode="decimal" placeholder="R$ (opcional)" min="0" step="50" />
      </div>
    </div>
    <div class="section-head">Por categoria</div>
    <div class="cat-bars" id="catBars"></div>
    <div class="section-head" style="margin-top:20px">Distribuição</div>
    <div class="chart-wrap">
      <div class="legend" id="pieLegend"></div>
      <div style="position:relative;width:100%;height:180px;"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <!-- ANO -->
  <div class="screen" id="screen-ano">
    <div class="month-bar">
      <button id="prevY">&#8592;</button>
      <div class="month-title" id="yearLabel">—</div>
      <button id="nextY">&#8594;</button>
    </div>
    <div class="section-head">Evolução</div>
    <div class="chart-wrap" style="margin-bottom:20px;">
      <div style="position:relative;width:100%;height:180px;"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="section-head">Meses</div>
    <div class="annual-grid" id="annualGrid"></div>
    <div class="section-head">Categorias</div>
    <div class="cat-bars" id="annualCatBars"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-screen="add">
      <span class="nav-icon">✦</span><span>Lançar</span>
    </button>
    <button class="nav-btn" data-screen="resumo">
      <span class="nav-icon">◎</span><span>Resumo</span>
    </button>
    <button class="nav-btn" data-screen="ano">
      <span class="nav-icon">◈</span><span>Ano</span>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CATS=['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Outros'];
const COLORS=['#4f8ef7','#5db88a','#e07a5f','#9b7fe8','#54b4d3','#e8b45a','#7a8fa8'];

const now=new Date();
let cm=now.getMonth(),cy=now.getFullYear(),vy=cy;
let appData={},metas={};
let pieChart=null,lineChart=null;

function mkey(y,m){return `${y}-${m}`;}
function expenses(y,m){return appData[mkey(y,m)]||[];}
function fmt(v){return 'R$\u00a0'+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtShort(v){return 'R$\u00a0'+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function todayStr(){return now.toISOString().slice(0,10);}
function fmtDate(s){if(!s)return '';const[y,m,d]=s.split('-');return `${d}/${m}`;}
function isToday(s){return s===todayStr();}
function isYesterday(s){const y=new Date(now);y.setDate(y.getDate()-1);return s===y.toISOString().slice(0,10);}
function dayLabel(s){if(!s)return '';if(isToday(s))return 'Hoje';if(isYesterday(s))return 'Ontem';return fmtDate(s);}

document.getElementById('dateInput').value=todayStr();

function setMonthLabels(){
  const t=MONTHS[cm]+' '+cy;
  document.getElementById('monthLabel').textContent=t;
  document.getElementById('monthLabel2').textContent=t;
  document.getElementById('heroLabel').textContent='Total em '+MONTHS[cm];
}

function calcStats(){
  const exps=expenses(cy,cm);
  const bycat={};CATS.forEach(c=>bycat[c]=0);
  exps.forEach(e=>bycat[e.cat]=(bycat[e.cat]||0)+e.amount);
  const total=exps.reduce((s,e)=>s+e.amount,0);
  const passados=(cy===now.getFullYear()&&cm===now.getMonth())?now.getDate():daysInMonth(cy,cm);
  const media=passados>0?total/passados:0;
  const maxCat=CATS.reduce((a,b)=>bycat[a]>=bycat[b]?a:b);
  return{exps,bycat,total,media,passados,maxCat};
}

function render(){setMonthLabels();renderAdd();renderResumo();}

function renderAdd(){
  const{total,media,bycat,maxCat,exps}=calcStats();
  document.getElementById('hTotal').textContent=Number(total).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('hMedia').textContent=fmt(media);
  document.getElementById('hCat').textContent=bycat[maxCat]>0?maxCat:'—';
  renderList(exps);
}

function renderList(exps){
  const el=document.getElementById('expenseList');
  if(!exps.length){el.innerHTML='<div class="empty">Nenhum gasto registrado</div>';return;}
  const sorted=[...exps].map((e,i)=>({...e,origIdx:i})).sort((a,b)=>{
    if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;
    return b.date.localeCompare(a.date);
  });
  const groups={},groupOrder=[];
  sorted.forEach(e=>{const dk=e.date||'__';if(!groups[dk]){groups[dk]=[];groupOrder.push(dk);}groups[dk].push(e);});
  let html='';
  groupOrder.forEach(dk=>{
    const label=dk==='__'?'Sem data':dayLabel(dk)+(dk!==todayStr()&&!isYesterday(dk)?'  ·  '+fmtDate(dk):'');
    html+=`<div class="day-group-label">${label}</div>`;
    groups[dk].forEach(e=>{
      const col=COLORS[CATS.indexOf(e.cat)]||'#7a8fa8';
      html+=`<div class="expense-item">
        <span class="cat-dot-lg" style="background:${col}"></span>
        <div class="e-info"><div class="e-desc">${e.desc}</div><div class="e-cat">${e.cat}</div></div>
        <div class="e-amt">${fmt(e.amount)}</div>
        <button class="e-del" data-i="${e.origIdx}">×</button>
      </div>`;
    });
  });
  el.innerHTML=html;
  el.querySelectorAll('.e-del').forEach(b=>b.addEventListener('click',e=>{
    appData[mkey(cy,cm)].splice(parseInt(e.target.dataset.i),1);render();
  }));
}

function renderResumo(){
  const{total,media,bycat,maxCat}=calcStats();
  document.getElementById('rTotal').textContent=Number(total).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('rMedia').textContent=fmt(media);
  const meta=metas[mkey(cy,cm)]||0;
  document.getElementById('metaInput').value=meta||'';
  if(meta>0){
    const saldo=meta-total,pct=Math.min(100,Math.round(total/meta*100));
    const metaEl=document.getElementById('rMeta');
    metaEl.textContent=fmt(Math.abs(saldo));
    metaEl.className='hero-stat-val '+(saldo<0?'danger':'success');
    document.getElementById('metaPct').textContent=pct+'%';
    const bar=document.getElementById('metaBar');
    bar.style.width=pct+'%';
    bar.className='meta-bar-fill'+(saldo<0?' over':'');
  } else {
    document.getElementById('rMeta').textContent='Sem meta';
    document.getElementById('rMeta').className='hero-stat-val';
    document.getElementById('metaPct').textContent='';
    document.getElementById('metaBar').style.width='0%';
  }
  renderCatBars(bycat,'catBars');
  renderPie(bycat,total);
}

function renderCatBars(bycat,id){
  const maxVal=Math.max(...CATS.map(c=>bycat[c]||0),1);
  document.getElementById(id).innerHTML=CATS.map((c,i)=>{
    const v=bycat[c]||0,pct=Math.round(v/maxVal*100);
    return `<div class="cat-bar-row">
      <span class="cat-dot" style="background:${COLORS[i]}"></span>
      <span class="cat-name">${c}</span>
      <div class="cat-track"><div class="cat-fill" style="width:${pct}%;background:${COLORS[i]}"></div></div>
      <span class="cat-amt">${fmt(v)}</span>
    </div>`;
  }).join('');
}

function renderPie(bycat,total){
  const labels=CATS.filter(c=>bycat[c]>0),vals=labels.map(c=>bycat[c]),cols=labels.map(c=>COLORS[CATS.indexOf(c)]);
  document.getElementById('pieLegend').innerHTML=labels.length
    ?labels.map((c,i)=>`<span class="legend-item"><span class="legend-sq" style="background:${cols[i]}"></span>${c}</span>`).join('')
    :'<span style="font-size:14px;color:var(--text3);font-style:italic;font-family:\'Cormorant Garamond\',serif">Sem dados</span>';
  if(pieChart)pieChart.destroy();
  if(!vals.length)return;
  pieChart=new Chart(document.getElementById('pieChart'),{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:cols,borderWidth:2,borderColor:'#111827'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed)+' ('+Math.round(ctx.parsed/(total||1)*100)+'%)'}}}}
  });
}

function renderAno(){
  document.getElementById('yearLabel').textContent=vy;
  const totals=MONTHS.map((_,m)=>expenses(vy,m).reduce((s,e)=>s+e.amount,0));
  const catTotals={};CATS.forEach(c=>catTotals[c]=0);
  MONTHS.forEach((_,m)=>expenses(vy,m).forEach(e=>catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount));
  document.getElementById('annualGrid').innerHTML=MONTHS.map((name,m)=>{
    const isCur=vy===cy&&m===cm,v=totals[m];
    return `<div class="annual-cell${isCur?' current':''}">
      <div class="annual-month">${MONTHS_SHORT[m]}</div>
      <div class="annual-val${isCur?' current':v>0?'':' empty-val'}">${v>0?fmtShort(v):'—'}</div>
    </div>`;
  }).join('');
  if(lineChart)lineChart.destroy();
  lineChart=new Chart(document.getElementById('lineChart'),{
    type:'line',
    data:{labels:MONTHS_SHORT,datasets:[{label:'Gasto',data:totals,borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,0.06)',borderWidth:1.5,pointBackgroundColor:'#4f8ef7',pointRadius:3,pointBorderWidth:0,fill:true,tension:0.4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}},
      scales:{
        y:{ticks:{callback:v=>'R$'+Math.round(v),font:{size:10},color:'#4a5568'},grid:{color:'rgba(255,255,255,0.04)'},border:{display:false}},
        x:{ticks:{font:{size:10},color:'#4a5568'},grid:{display:false},border:{display:false}}
      }
    }
  });
  renderCatBars(catTotals,'annualCatBars');
}

document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('screen-'+btn.dataset.screen).classList.add('active');
  if(btn.dataset.screen==='ano')renderAno();
  if(btn.dataset.screen==='resumo')renderResumo();
}));
function changeMonth(d){cm+=d;if(cm<0){cm=11;cy--;}else if(cm>11){cm=0;cy++;}render();}
document.getElementById('prevM').addEventListener('click',()=>changeMonth(-1));
document.getElementById('nextM').addEventListener('click',()=>changeMonth(1));
document.getElementById('prevM2').addEventListener('click',()=>changeMonth(-1));
document.getElementById('nextM2').addEventListener('click',()=>changeMonth(1));
document.getElementById('prevY').addEventListener('click',()=>{vy--;renderAno();});
document.getElementById('nextY').addEventListener('click',()=>{vy++;renderAno();});
document.getElementById('metaInput').addEventListener('change',e=>{
  metas[mkey(cy,cm)]=parseFloat(e.target.value)||0;renderResumo();
});
document.getElementById('addBtn').addEventListener('click',()=>{
  const desc=document.getElementById('desc').value.trim();
  const amount=parseFloat(document.getElementById('amount').value);
  const cat=document.getElementById('cat').value;
  const date=document.getElementById('dateInput').value;
  if(!desc||isNaN(amount)||amount<=0)return;
  const k=mkey(cy,cm);
  if(!appData[k])appData[k]=[];
  appData[k].push({desc,amount,cat,date});
  document.getElementById('desc').value='';
  document.getElementById('amount').value='';
  document.getElementById('dateInput').value=todayStr();
  render();
});
render();
</script>
